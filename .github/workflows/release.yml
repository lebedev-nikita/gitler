name: Desktop checks and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (leave empty to build the selected ref)
        required: false
      publish:
        description: Publish the tagged release after all platforms succeed
        type: boolean
        default: false
      check_budget:
        description: Enforce the five-minute budget (run after warming the cache)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: desktop-${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && 'release' || 'check' }}-${{ inputs.tag || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 5
    outputs:
      ref: ${{ inputs.tag || github.sha }}
      tauri_cli: ${{ steps.cli.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check and test frontend
        run: |
          bun run check
          bun run test
          python3 -m unittest discover -s scripts -p 'test_release.py'
      - name: Build frontend once for every platform
        run: bun run build
      - name: Resolve the locked Tauri CLI version
        id: cli
        run: bun -e 'console.log("version=" + require("./node_modules/@tauri-apps/cli/package.json").version)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify version and create draft release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py prepare "$RELEASE_TAG"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            asset: macos-arm64
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x64
            bundles: app,dmg
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: windows-x64
            bundles: nsis,msi
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: windows-arm64
            bundles: nsis
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
            bundles: appimage,deb,rpm
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            bundles: appimage,deb,rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      # Keep registry sources and build outputs together. Removing sources makes
      # objc2's native build helpers invalidate the cached macOS dependency graph.
      - name: Restore native release cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: native-release-v1-${{ runner.os }}-${{ matrix.target }}-1.99.0-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
            src-tauri/target/${{ matrix.target }}/release/build
            src-tauri/target/${{ matrix.target }}/release/deps
            src-tauri/target/${{ matrix.target }}/release/.fingerprint
      - name: Bootstrap from the previous dependency cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.target }}
          cache-workspace-crates: true
          save-if: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend
          path: dist
      - name: Test native Git inspection
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build and attach platform installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          tauriScript: bunx --bun @tauri-apps/cli@${{ needs.prepare.outputs.tauri_cli }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"build":{"beforeBuildCommand":""}}'
          releaseAssetNamePattern: Gitler_[version]_${{ matrix.asset }}[ext]
          uploadWorkflowArtifacts: ${{ !needs.prepare.outputs.release_id }}
          workflowArtifactNamePattern: Gitler_[version]_${{ matrix.asset }}[ext]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
      - name: Save native release cache
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && !inputs.tag && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
            src-tauri/target/${{ matrix.target }}/release/build
            src-tauri/target/${{ matrix.target }}/release/deps
            src-tauri/target/${{ matrix.target }}/release/.fingerprint

  publish:
    if: needs.prepare.outputs.release_id != ''
    name: Verify downloads and publish
    needs: [prepare, build]
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Verify all platforms, attach checksums, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/release.py publish "$RELEASE_TAG"

  budget:
    name: Check five-minute pipeline budget
    if: always() && inputs.check_budget && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [prepare, build, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check total elapsed time, including setup and uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_ci_budget.py "$(gh run view "$GITHUB_RUN_ID" --json createdAt --jq .createdAt)"
