name: Desktop checks and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (leave empty to build the selected ref)
        required: false
      publish:
        description: Publish the tagged macOS Apple Silicon release
        type: boolean
        default: false
      check_budget:
        description: Enforce the three-minute budget (run after warming the cache)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.99.0"
  NATIVE_TARGET: aarch64-apple-darwin

concurrency:
  group: desktop-${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && 'release' || 'check' }}-${{ inputs.tag || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 5
    outputs:
      ref: ${{ inputs.tag || github.sha }}
      tauri_cli: ${{ steps.cli.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check and test frontend
        run: |
          bun run check
          bun run test
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build frontend
        run: bun run build
      - name: Resolve the locked Tauri CLI version
        id: cli
        run: |
          bun -e 'console.log("version=" + require("./node_modules/@tauri-apps/cli/package.json").version)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify version and create draft release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py prepare "$RELEASE_TAG"

  build:
    name: macOS Apple Silicon
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Start native prerequisite setup
        run: python3 scripts/native_ci_setup.py start ${{ env.NATIVE_TARGET }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend
          path: dist
      - name: Hash the native sources and built frontend
        id: native-source
        run: python3 scripts/native_ci_cache.py key
      # Keep registry sources and build outputs together. Removing sources makes
      # objc2's native build helpers invalidate the cached macOS dependency graph.
      - name: Restore native release cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: native-source-v2-${{ runner.os }}-${{ env.NATIVE_TARGET }}-1.99.0-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ steps.native-source.outputs.key }}
          restore-keys: |
            native-source-v2-${{ runner.os }}-${{ env.NATIVE_TARGET }}-1.99.0-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
            native-source-v2-${{ runner.os }}-${{ env.NATIVE_TARGET }}-1.99.0-
            native-source-v1-${{ runner.os }}-${{ env.NATIVE_TARGET }}-1.99.0-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ steps.native-source.outputs.key }}
            native-source-v1-${{ runner.os }}-${{ env.NATIVE_TARGET }}-1.99.0-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
            native-source-v1-${{ runner.os }}-${{ env.NATIVE_TARGET }}-1.99.0-
            native-release-v1-${{ runner.os }}-${{ env.NATIVE_TARGET }}-1.99.0-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
            native-release-v1-${{ runner.os }}-${{ env.NATIVE_TARGET }}-1.99.0-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
            src-tauri/target/${{ env.NATIVE_TARGET }}/release/build
            src-tauri/target/${{ env.NATIVE_TARGET }}/release/deps
            src-tauri/target/${{ env.NATIVE_TARGET }}/release/.fingerprint
      - name: Wait for native prerequisites before compiling
        run: python3 scripts/native_ci_setup.py wait
      - name: Bootstrap from the previous dependency cache
        if: steps.native-cache.outputs.cache-matched-key == ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ env.NATIVE_TARGET }}
          cache-workspace-crates: true
          save-if: false
      - name: Prepare content-checked native cache
        run: python3 scripts/native_ci_cache.py prepare
      - name: Test native Git inspection
        env:
          # Match Tauri's default so native macOS helpers are reused by the build.
          MACOSX_DEPLOYMENT_TARGET: "10.13"
          TAURI_CONFIG: '{"build":{"beforeBuildCommand":""}}'
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target ${{ env.NATIVE_TARGET }} --config 'profile.release.package.gitler.opt-level=0'
      - name: Build and attach macOS Apple Silicon downloads
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          tauriScript: bunx --bun @tauri-apps/cli@${{ needs.prepare.outputs.tauri_cli }}
          args: --target ${{ env.NATIVE_TARGET }} --bundles app,dmg --config '{"build":{"beforeBuildCommand":""}}'
          releaseAssetNamePattern: Gitler_[version]_macos-arm64[ext]
          uploadWorkflowArtifacts: ${{ !needs.prepare.outputs.release_id }}
          workflowArtifactNamePattern: Gitler_[version]_macos-arm64[ext]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
      - name: Trim obsolete native outputs before caching
        if: success() && steps.native-cache.outputs.cache-hit != 'true'
        run: python3 scripts/trim_native_ci_cache.py
      - name: Save native release cache
        if: success() && github.ref == 'refs/heads/main' && !inputs.tag && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
            src-tauri/target/${{ env.NATIVE_TARGET }}/release/build
            src-tauri/target/${{ env.NATIVE_TARGET }}/release/deps
            src-tauri/target/${{ env.NATIVE_TARGET }}/release/.fingerprint

  publish:
    if: needs.prepare.outputs.release_id != ''
    name: Verify downloads, publish, and update Homebrew
    needs: [prepare, build]
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Check out the Homebrew tap for writing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jeff-business/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Verify Apple Silicon downloads, attach checksums, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/release.py publish "$RELEASE_TAG"
      - name: Update the Homebrew cask and push its commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release.py update-tap "$RELEASE_TAG" homebrew-tap

  budget:
    name: Check three-minute pipeline budget
    if: always() && (inputs.check_budget || startsWith(github.ref, 'refs/tags/') || inputs.publish) && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [prepare, build, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check total elapsed time, including setup and uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_ci_budget.py "$(gh run view "$GITHUB_RUN_ID" --json createdAt --jq .createdAt)"
