[package]
name = "gitler"
version = "0.2.3"
description = "A repository-wide Git graph and worktree inspector"
license-file = "../LICENSE"
authors = ["Gitler contributors"]
edition = "2021"

[lib]
name = "gitler_lib"
# Desktop executables need only an rlib; shared outputs collide across profiles.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
tempfile = "3"
dunce = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
