[package]
name = "gitler"
version = "0.4.2"
description = "A repository-wide Git graph and worktree inspector"
license-file = "../LICENSE"
authors = ["Gitler contributors"]
edition = "2021"
default-run = "gitler"

[features]
browser-dev = []

[[bin]]
name = "gitler-browser"
path = "src/browser_main.rs"
required-features = ["browser-dev"]

[lib]
name = "gitler_lib"
# Desktop executables need only an rlib; shared outputs collide across profiles.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
tempfile = "3"
sha2 = "0.10"
libc = "0.2"
base64 = "0.22"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
