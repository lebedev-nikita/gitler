[package]
name = "gitler"
version = "0.2.0"
description = "A repository-wide Git graph and worktree inspector"
license-file = "../LICENSE"
authors = ["Gitler contributors"]
edition = "2021"

[lib]
name = "gitler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
tempfile = "3"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
